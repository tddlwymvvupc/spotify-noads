<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0B0E0D"/>
  
  <!-- Vinyl record body, off-center composition -->
  <g>
    <!-- Outer record disc -->
    <circle cx="118" cy="128" r="92" fill="#1ED760"/>
    <circle cx="118" cy="128" r="92" fill="none" stroke="#0B0E0D" stroke-width="2"/>
    
    <!-- Subtle vinyl grooves -->
    <g fill="none" stroke="#0B0E0D" stroke-width="1.2" opacity="0.55">
      <circle cx="118" cy="128" r="84"/>
      <circle cx="118" cy="128" r="76"/>
      <circle cx="118" cy="128" r="68"/>
      <circle cx="118" cy="128" r="61"/>
      <circle cx="118" cy="128" r="54"/>
      <circle cx="118" cy="128" r="47"/>
    </g>
    
    <!-- Highlight arc top-left for depth -->
    <path d="M 48 88 A 80 80 0 0 1 118 44" fill="none" stroke="#F2F5F1" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    
    <!-- Center label / blocked circle -->
    <circle cx="118" cy="128" r="30" fill="#F2F5F1"/>
    <circle cx="118" cy="128" r="30" fill="none" stroke="#0B0E0D" stroke-width="2.5"/>
    
    <!-- Diagonal blocked bar across the label -->
    <line x1="97" y1="149" x2="139" y2="107" stroke="#0B0E0D" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Thin white diagonal offset for subtle rebellion accent -->
    <line x1="99" y1="151" x2="141" y2="109" stroke="#8A8F8C" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Spindle hole -->
    <circle cx="118" cy="128" r="4.5" fill="#0B0E0D"/>
  </g>
  
  <!-- Small wordmark, bottom-right, quiet -->
  <text x="176" y="236" font-family="monospace" font-size="9" fill="#8A8F8C" letter-spacing="1" text-anchor="middle">spotify-noads</text>
</svg>
